name: Build Node.js untuk Android (arm64 + armv7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
    env:
      NODE_VERSION: v20.18.1
      NDK_VERSION: r26d
    steps:
      - name: Install dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ gcc-multilib g++-multilib ccache unzip curl

      - name: Unduh source Node.js dan verifikasi hash
        run: |
          curl -fsSLO https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}.tar.gz
          curl -fsSLO https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt
          grep " node-${NODE_VERSION}.tar.gz\$" SHASUMS256.txt | sha256sum -c -
          tar xzf node-${NODE_VERSION}.tar.gz

      - name: Unduh Android NDK
        run: |
          curl -fsSLO https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure (${{ matrix.arch }})
        working-directory: node-${{ env.NODE_VERSION }}
        run: ./android-configure "$NDK_PATH" 24 ${{ matrix.arch }}

      - name: Build (${{ matrix.arch }})
        working-directory: node-${{ env.NODE_VERSION }}
        run: make -j"$(nproc)"

      - name: Strip dan ganti nama
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp node-${NODE_VERSION}/out/Release/node out/${{ matrix.abi }}/libnode.so
          "$NDK_PATH"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/${{ matrix.abi }}/libnode.so
          ls -lh out/${{ matrix.abi }}/libnode.so
          sha256sum out/${{ matrix.abi }}/libnode.so

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/libnode.so
