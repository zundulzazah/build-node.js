name: Build Node.js untuk Android (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NODE_VERSION: v20.18.1
      NDK_VERSION: r26d
      CC_host: gcc
      CXX_host: g++
    steps:
      - name: Pasang Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ ccache unzip curl

      - name: Unduh source Node.js dan verifikasi hash
        run: |
          curl -fsSLO https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}.tar.gz
          curl -fsSLO https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt
          grep " node-${NODE_VERSION}.tar.gz\$" SHASUMS256.txt | sha256sum -c -
          tar xzf node-${NODE_VERSION}.tar.gz

      - name: Unduh Android NDK
        run: |
          curl -fsSLO https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure (arm64)
        working-directory: node-${{ env.NODE_VERSION }}
        run: ./android-configure "$NDK_PATH" 24 arm64

      - name: Build (arm64)
        working-directory: node-${{ env.NODE_VERSION }}
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Ringkasan error (hanya jika gagal)
        if: failure()
        run: |
          echo "===== 40 BARIS TERAKHIR ====="
          tail -n 40 build.log
          echo "===== BARIS BERISI ERROR ====="
          grep -n -B2 -A6 -E "error:|Error [0-9]|undefined reference|No such file" build.log | head -n 120

      - name: Strip dan ganti nama
        run: |
          mkdir -p out/arm64-v8a
          cp node-${NODE_VERSION}/out/Release/node out/arm64-v8a/libnode.so
          "$NDK_PATH"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/arm64-v8a/libnode.so
          ls -lh out/arm64-v8a/libnode.so
          sha256sum out/arm64-v8a/libnode.so

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: libnode-arm64-v8a
          path: out/arm64-v8a/libnode.so
