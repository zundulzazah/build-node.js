name: Decompile APK

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Path APK yang sudah di-upload ke repo (mis. uploads/app.apk). Kosongkan jika pakai URL"
        required: false
        type: string
      apk_url:
        description: "URL langsung ke file .apk (mis. link asset GitHub Release). Kosongkan jika pakai path"
        required: false
        type: string
      use_apktool:
        description: "Jalankan apktool (resource, manifest, smali)"
        type: boolean
        default: true
      use_jadx:
        description: "Jalankan jadx (kode Java/Kotlin)"
        type: boolean
        default: true

env:
  APKTOOL_VERSION: "2.10.0"
  JADX_VERSION: "1.5.0"

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (untuk APK yang di-upload)
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ambil APK (dari path repo atau URL)
        env:
          APK_PATH: ${{ inputs.apk_path }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if [ -n "$APK_PATH" ] && [ -n "$APK_URL" ]; then
            echo "Isi salah satu saja: apk_path ATAU apk_url." >&2; exit 1
          elif [ -n "$APK_PATH" ]; then
            if [ ! -f "$APK_PATH" ]; then
              echo "File tidak ditemukan di repo: $APK_PATH" >&2; exit 1
            fi
            cp "$APK_PATH" app.apk
          elif [ -n "$APK_URL" ]; then
            curl -fL --retry 3 -o app.apk "$APK_URL"
          else
            echo "Isi apk_path atau apk_url." >&2; exit 1
          fi
          ls -lh app.apk
          unzip -tq app.apk >/dev/null || { echo "File bukan APK/ZIP yang valid." >&2; exit 1; }

      - name: Ekstrak isi APK (unzip)
        run: unzip -q app.apk -d out_unzip

      - name: Bongkar dengan apktool
        if: ${{ inputs.use_apktool }}
        run: |
          curl -fL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar d app.apk -o out_apktool -f

      - name: Dekompilasi dengan jadx
        if: ${{ inputs.use_jadx }}
        run: |
          curl -fL -o jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx
          # jadx sering keluar dengan kode error karena sebagian kelas gagal didekompilasi
          ./jadx/bin/jadx -d out_jadx app.apk || true

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: hasil-bongkar-apk
          path: |
            out_unzip
            out_apktool
            out_jadx
          retention-days: 7
          if-no-files-found: ignore
